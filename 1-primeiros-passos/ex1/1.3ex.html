<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome_usuario = window.prompt(`Qual seu nome: `)
        var idade = window.prompt(`Qual sua idade: `)
        var idade = Number(idade)
    
        window.document.writeln(`Eu sou de Asgard e meu rei se chama, <strong>${nome_usuario}</strong>, sua idade é <strong>${idade}</strong> <br>`)
        window.document.writeln(`Seu nome em maiusculo fica <strong>${nome_usuario.toUpperCase()}</strong> <br>`)
        window.document.writeln(`A quantidade de caracteres no seu nome é <strong>${nome_usuario.length}</strong>`)
        </script>                
</body>
</html>
