        let crono = 0

        if (!isNaN(num) && num >= 0 && Number(num)) {


            function Explosao() {
                if (num >= crono) {
                    document.getElementById("Resultado").innerHTML +=`<p>A bomba irá explodir em: ${num} segundos.</p>`;
                    num--
                } else {
                    clearInterval(timer)
                    alert(`💥 EXPLODIU!`)
                }
            }
        } else {
            alert(`Valor invalido, tente da proxima vez`)
        }
        let timer = setInterval(Explosao, 1000);
    </script>
