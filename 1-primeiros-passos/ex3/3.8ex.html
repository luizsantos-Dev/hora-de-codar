<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        for (let i = 1; i <= 10; i++) {
            let num = parseInt(prompt(`Digite o ${i}º número: `))
            if(num > 100){
                document.write(`O número ${i}º é valido por ter o valor ${num}.<br>`)
            }
            
        }
    </script>
</body>
</html>
