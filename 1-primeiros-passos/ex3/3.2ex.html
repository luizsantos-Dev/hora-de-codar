<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        var n1 = Number(prompt(`Digite o primeiro número: `))
        var n2 = Number(prompt(`Digite o segundo número: `))
        while(n2 <= 0) {
            var n2 = Number(prompt(`Digite o segundo número novamente(maior que 0): `))
            
        }
        var resultado = n1 / n2
        document.write(`Essa foi a divisão de ${n1} e ${n2}: ${resultado}`)
    </script>
</body>
</html>
