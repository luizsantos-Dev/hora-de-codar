<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var n1 = parseInt(prompt(`Digite o primeiro número: `));
        var n2 = parseInt(prompt(`Digite o segundo número: `));
        var cont = 0
        var soma = 0

        while (n2 <= n1){
            n2 = parseInt(prompt(`Digite o segundo número maior que ${n1}:`));
        };

        var mdns = (n1 + n2) / 2

        for (let i = n1 + 1; i < n2; i++){
            soma += i
            cont++

        }
        var mds = soma / cont

        document.writeln(`A média aritmética dos dois primeiros números é : ${mdns}.`);
        document.writeln(`A média aritmética dos números entre eles são : ${mds}.`);
        
    </script>
</body>
</html>
