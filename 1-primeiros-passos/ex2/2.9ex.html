<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var ano = Number(prompt(`Digite o ano em que nasceu`))
        var idade = 2026 - ano
        if( idade >= 18){
            document.writeln(`Você tem ${idade} e por isso pode votar.`)
        }else{
            document.writeln(`Você tem ${idade} e por isso não pode votar.`)
        }

    </script>
    
</body>
</html>
