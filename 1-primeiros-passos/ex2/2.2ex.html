<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = prompt(`Digite um número: `)
        
        if(n1 >=1){
            alert(`Esse numero é positivo`)
        }
        
        if(n1 ==0 ){
            alert(`Esse numero é Nulo`)
        }
        
        if(n1 <0 ){
            alert(`Esse numero é Negativo`)
        }
    </script>
</body>
</html>
