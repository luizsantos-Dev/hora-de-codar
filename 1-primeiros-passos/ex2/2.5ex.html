<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        var n1 = Number(prompt(`Digite o primeiro número: `))
        var n2 = Number(prompt(`Digite o segundo número: `))
        var n3 = Number(prompt(`Digite o terceiro número: `))
        var n4 = Number(prompt(`Digite o quarto número: `))
        var n5 = Number(prompt(`Digite o quinto número: `))
        var n6 = Number(prompt(`Digite o sexto número: `))
        var calculo = Number(n1 + n2 + n3 + n4 + n5 + n6)
        var aritmetica = calculo / 6
        
        window.document.writeln(`O seu resultado foi ${calculo}, a média aritmética é: ${aritmetica}`)
    </script>
</body>
</html>
