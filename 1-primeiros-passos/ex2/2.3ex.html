<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = prompt(`Digite o primeiro número: `)
        var n2 = prompt(`Digite o segundo número: `)
        var n3 = prompt(`Digite o terceiro numero`)

        if(n1 > n2 & n1 > n3){
            alert(`O numero ${n1} é maior que ${n2} e ${n3}`)

        }else if(n2 > n1 & n2 > n3){
            alert(`O numero ${n2} é maior que ${n1} e ${n3}`)

        }else if(n3 > n1 & n3 > n2){
            alert(`O numero ${n3} é maior que ${n1} e ${n2}`)
        }
            
    </script>
</body>
</html>
