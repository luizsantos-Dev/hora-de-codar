        var n3 = Number(prompt(`Digite o terceiro número: `))

        if(n1 == n2 & n1 == n3){
              var resultado = n1+n2+n3
        alert(`O valor é: ${resultado}`)
        }
        if(n1 >= n2 & n1 >= n3){

                alert(`O valor é: ${resultado}.`)
            }else{
                var resultado = n1 + n3
                alert(`O valor é: ${resultado}.`)
            }
        }

        if(n2 >= n1 & n2 >= n3){

            }else{

        if(n3 >= n2 & n3 >= n1){

                alert(`O valor é: ${resultado}.`)
            }else{
                var resultado = n2 + n3
                alert(`O valor é: ${resultado}.`)

        }
      
</script>
