<html>

<head>

	<script>

		var nome = prompt(`Qual seu nome : `)

	    // Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.
    
		var saldo = 100.5; // Float (Número com ponto flutuante)

		alert(`Olá ${nome}, é um prazer ter você aqui! `)
		/*  Função principal. */
		function inicio() {

			var escolha = parseInt(prompt('Selecione uma opção \n1.) Saldo\n 2.) Depósito\n 3.) Saque\n 4.) Extrato \n5.) Sair'));

			// if (escolha === 1) {
			// 	ver_saldo();
			// } else if (escolha === 2) {
			// 	fazer_deposito();
			// } else if (escolha === 3) {
			// 	fazer_saque();
			// } else if (escolha === 4) {
			// 	sair();
			// } else {
			// 	erro();
			// }

			switch (escolha) {
				case 1:
					ver_saldo();
				break;
				
				case 2:
					fazer_deposito();
				break;

				case 3:
					fazer_saque();
				break;

				case 4: 
					ver_extrato();
				break;
				case 5: 
					sair();
				break;
				default:
					while(escolha > 5){
					escolha = parseInt(prompt('Selecione uma opção \n1.) Saldo\n 2.) Depósito\n 3.) Saque\n 4.) Extrato \n5.) Sair'));
					}
				break;
			};

			
		}

		function ver_extrato(){
			alert(`20/08 = -100\n23/08 = -600\n04/09 = -300\n13/09 = 1400`)
			inicio();
		};

		/*  Função principal. */
		function ver_saldo() {
			alert('Seu saldo atual é: ' + saldo);
			inicio();
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
			var deposito = parseFloat(prompt('Qual o valor para depósito?')); 
			// Not a Number
			if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
				alert('Por favor, informe um número:');
				fazer_deposito();
			} else {
				saldo += deposito;
				ver_saldo();
			}
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_saque() {
			var saque = parseFloat(prompt('Qual o valor para saque?'));
			if (isNaN(saque) || saque === '') {
				alert('Por favor, informe um número:');
				fazer_saque();
			} else{
				if(saque <= 0){
					alert(`Saque negativo`);
					fazer_saque();
				}else{
					if(saldo < saque){
						alert(`Saldo insuficiente`);
						fazer_saque();
					}else{
						saldo -= saque;
						ver_saldo();
					};
				};
			};
		};
		

		/* Verificar se há um erro */
		function erro() {
			alert('Por favor, informe um número entre 1 a 4');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				window.close();
			} else {
				inicio();
			}
		}



		inicio();
	</script>
</head>

</html>
